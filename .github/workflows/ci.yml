name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (UTC)
        run: npm test
        env:
          TZ: UTC
      - name: Unit tests (America/Los_Angeles)
        run: npm test
        env:
          TZ: America/Los_Angeles
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
